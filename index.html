<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Prices</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, Helvetica, sans-serif; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px; box-sizing: border-box; }
  .card { flex: 1 1 130px; min-width: 130px; max-width: 180px; box-sizing: border-box;
          background: #ffffff; border: 1px solid #e6e6e6; border-radius: 6px; padding: 8px 10px 6px; }
  .name  { font-size: 13px; font-weight: bold; color: #111; margin-bottom: 1px; }
  .price { font-size: 12px; color: #333; margin-bottom: 4px; }
  .price .unit { color: #666; }
  .chg   { font-size: 12px; font-weight: bold; margin-bottom: 1px; }
  .chglbl { font-size: 10px; color: #777; margin-bottom: 3px; }
  .up    { color: #2e7d32; }
  .down  { color: #d32f2f; }
  .spark { display: block; width: 100%; height: 30px; }
  .hl    { display: flex; justify-content: space-between; font-size: 10px; color: #555; margin-top: 3px; }
  .range { font-size: 10px; color: #777; margin-top: 1px; text-align: center; }
  .trend { font-size: 10px; font-weight: bold; margin-top: 1px; text-align: center; }
  .asof  { font-size: 10px; color: #777; margin-top: 4px; border-top: 1px solid #eee; padding-top: 3px; }
  .note  { font-size: 10px; color: #777; padding: 0 8px 4px; }
</style>
</head>
<body>
<div class="cards" id="cards"><div class="card"><div class="price">Loading prices...</div></div></div>
<div class="note">Source: U.S. Energy Information Administration (EIA). Each chart is scaled to its own high and low.</div>

<script>
  // ---------- SETTINGS ----------
  var API_KEY = "FaZ3URrtmHb2A8UXEarSFNlGaZNHk9yqASkY2fNb";

  var COMMODITIES = [
    { label: "WTI Crude",   unit: "USD/bbl.",   route: "petroleum/pri/spt",  series: "RWTC",
      freq: "daily",  points: 30 },
    { label: "Brent Crude", unit: "USD/bbl.",   route: "petroleum/pri/spt",  series: "RBRTE",
      freq: "daily",  points: 30 },
    { label: "Natural Gas", unit: "USD/MMBtu",  route: "natural-gas/pri/fut", series: "RNGWHHD",
      freq: "daily",  points: 30 },
    { label: "U.S. Gasoline (retail)", unit: "USD/gal.", route: "petroleum/pri/gnd", series: "EMM_EPMR_PTE_NUS_DPG",
      freq: "weekly", points: 26 }
  ];

  var CACHE_HOURS = 6;   // results are cached in the browser to limit requests
  // --------------------------------

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var cardsEl = document.getElementById("cards");

  function fmtDate(s, withYear) {
    var p = String(s).split("-");
    if (p.length < 3) return s;
    var out = MONTHS[parseInt(p[1], 10) - 1] + " " + parseInt(p[2], 10);
    return withYear ? out + ", " + p[0] : out;
  }

  function rangeLabel(first, last) {
    var sameYear = String(first).slice(0, 4) === String(last).slice(0, 4);
    return fmtDate(first, !sameYear) + " \u2013 " + fmtDate(last, true);
  }

  function showError(msg) {
    return '<div class="card"><div class="name">Error</div><div class="price">' + msg + '</div></div>';
  }

  function getCached(key) {
    try {
      var raw = localStorage.getItem("eia2_" + key);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.t > CACHE_HOURS * 3600 * 1000) return null;
      return obj.v;
    } catch (e) { return null; }
  }

  function setCached(key, value) {
    try { localStorage.setItem("eia2_" + key, JSON.stringify({ t: Date.now(), v: value })); } catch (e) {}
  }

  function fetchCommodity(item) {
    var cached = getCached(item.series);
    if (cached) return Promise.resolve(cached);

    var url = "https://api.eia.gov/v2/" + item.route + "/data/" +
      "?api_key=" + encodeURIComponent(API_KEY) +
      "&frequency=" + item.freq +
      "&data[0]=value" +
      "&facets[series][]=" + encodeURIComponent(item.series) +
      "&sort[0][column]=period&sort[0][direction]=desc" +
      "&length=" + (item.points + 10);

    return fetch(url)
      .then(function (r) {
        return r.json().catch(function () { throw new Error("HTTP " + r.status + " (not JSON)"); });
      })
      .then(function (json) {
        if (json.error) throw new Error("EIA: " + (json.error.message || json.error));
        if (json.response && json.response.warnings && !json.response.data) {
          throw new Error("EIA warning: " + JSON.stringify(json.response.warnings));
        }
        var rows = ((json.response && json.response.data) || []).filter(function (d) {
          return d.value !== null && d.value !== "" && !isNaN(parseFloat(d.value));
        });
        if (rows.length < 2) throw new Error("No data for " + item.series);
        var latest = parseFloat(rows[0].value);
        var prev = parseFloat(rows[1].value);
        var recent = rows.slice(0, item.points).reverse();   // oldest -> newest
        var result = {
          price: latest, change: latest - prev, pct: ((latest - prev) / prev) * 100,
          date: rows[0].period,
          values: recent.map(function (d) { return parseFloat(d.value); }),
          dates: recent.map(function (d) { return d.period; })
        };
        setCached(item.series, result);
        return result;
      });
  }

  function sparkline(values, trendUp, id) {
    var w = 200, h = 30, pad = 2;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var pts = values.map(function (v, i) {
      var x = (i / (values.length - 1)) * w;
      var y = pad + (1 - (v - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var color = trendUp ? "#2e7d32" : "#d32f2f";
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.25"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<polygon points="0,' + h + ' ' + pts.join(" ") + ' ' + w + ',' + h + '" fill="url(#g' + id + ')"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + color + '" stroke-width="1.5" ' +
      'vector-effect="non-scaling-stroke"/></svg>';
  }

  function card(item, d, idx) {
    var dayUp = d.change >= 0;
    var first = d.values[0], last = d.values[d.values.length - 1];
    var trendPct = ((last - first) / first) * 100;
    var trendUp = trendPct >= 0;
    var lo = Math.min.apply(null, d.values), hi = Math.max.apply(null, d.values);
    return '<div class="card">' +
      '<div class="name">' + item.label + '</div>' +
      '<div class="price">' + d.price.toFixed(2) + ' <span class="unit">' + item.unit + '</span></div>' +
      '<div class="chg ' + (dayUp ? "up" : "down") + '">' + (dayUp ? "&#9650;" : "&#9660;") + ' ' +
        Math.abs(d.pct).toFixed(2) + '%</div>' +
      '<div class="chglbl">vs. previous ' + (item.freq === "weekly" ? "week" : "reading") + '</div>' +
      sparkline(d.values, trendUp, idx) +
      '<div class="hl"><span>Low ' + lo.toFixed(2) + '</span><span>High ' + hi.toFixed(2) + '</span></div>' +
      '<div class="range">' + rangeLabel(d.dates[0], d.dates[d.dates.length - 1]) + '</div>' +
      '<div class="trend ' + (trendUp ? "up" : "down") + '">Trend: ' + (trendUp ? "up " : "down ") +
        Math.abs(trendPct).toFixed(1) + '% over period</div>' +
      '<div class="asof">As of ' + fmtDate(d.date, true) + '</div>' +
      '</div>';
  }

  if (API_KEY.indexOf("YOUR_EIA") === 0) {
    cardsEl.innerHTML = showError("Add your EIA API key at the top of this file.");
  } else Promise.all(COMMODITIES.map(function (item, i) {
    return fetchCommodity(item)
      .then(function (d) { return card(item, d, i); })
      .catch(function (e) {
        console.error(item.label, e);
        var msg = (e && e.message) ? e.message : String(e);
        if (msg === "Failed to fetch") msg = "Request blocked or network error (likely CORS or a bad key)";
        return showError(item.label + ": " + msg);
      });
  })).then(function (results) {
    cardsEl.innerHTML = results.join("");
  });
</script>
</body>
</html>
