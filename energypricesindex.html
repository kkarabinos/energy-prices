<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Prices</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; font-family: Arial, Helvetica, sans-serif; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px; box-sizing: border-box; }
  .card { flex: 1 1 160px; min-width: 160px; max-width: 260px; box-sizing: border-box;
          background: #ffffff; border: 1px solid #e6e6e6; border-radius: 6px; padding: 12px 14px 8px; }
  .name  { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 2px; }
  .price { font-size: 14px; color: #333; margin-bottom: 8px; }
  .price .unit { color: #666; }
  .chg   { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
  .up    { color: #2e7d32; }
  .down  { color: #d32f2f; }
  .spark { display: block; width: 100%; height: 44px; }
  .asof  { font-size: 11px; color: #777; margin-top: 4px; }
  .note  { font-size: 11px; color: #777; padding: 0 12px 6px; }
</style>
</head>
<body>
<div class="cards" id="cards"><div class="card"><div class="price">Loading prices...</div></div></div>
<div class="note">Source: U.S. Energy Information Administration (EIA)</div>

<script>
  // ---------- SETTINGS ----------
  // Free key from https://www.eia.gov/opendata/register.php
  var API_KEY = "FaZ3URrtmHb2A8UXEarSFNlGaZNHk9yqASkY2fNb";

  var COMMODITIES = [
    { label: "WTI Crude",   unit: "USD/bbl.",   route: "petroleum/pri/spt",  series: "RWTC",
      freq: "daily",  points: 30 },
    { label: "Brent Crude", unit: "USD/bbl.",   route: "petroleum/pri/spt",  series: "RBRTE",
      freq: "daily",  points: 30 },
    { label: "Natural Gas", unit: "USD/MMBtu",  route: "natural-gas/pri/fut", series: "RNGWHHD",
      freq: "daily",  points: 30 },
    { label: "U.S. Gasoline (retail)", unit: "USD/gal.", route: "petroleum/pri/gnd", series: "EMM_EPMR_PTE_NUS_DPG",
      freq: "weekly", points: 26 }
  ];

  var CACHE_HOURS = 6;   // results are cached in the browser to limit requests
  // --------------------------------

  var cardsEl = document.getElementById("cards");

  function showError(msg) {
    return '<div class="card"><div class="name">Error</div><div class="price">' + msg + '</div></div>';
  }

  function getCached(key) {
    try {
      var raw = localStorage.getItem("eia_" + key);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.t > CACHE_HOURS * 3600 * 1000) return null;
      return obj.v;
    } catch (e) { return null; }
  }

  function setCached(key, value) {
    try { localStorage.setItem("eia_" + key, JSON.stringify({ t: Date.now(), v: value })); } catch (e) {}
  }

  function fetchCommodity(item) {
    var cached = getCached(item.series);
    if (cached) return Promise.resolve(cached);

    var url = "https://api.eia.gov/v2/" + item.route + "/data/" +
      "?api_key=" + encodeURIComponent(API_KEY) +
      "&frequency=" + item.freq +
      "&data[0]=value" +
      "&facets[series][]=" + encodeURIComponent(item.series) +
      "&sort[0][column]=period&sort[0][direction]=desc" +
      "&length=" + (item.points + 10);

    return fetch(url)
      .then(function (r) {
        return r.json().catch(function () { throw new Error("HTTP " + r.status + " (not JSON)"); });
      })
      .then(function (json) {
        if (json.error) throw new Error("EIA: " + (json.error.message || json.error));
        if (json.response && json.response.warnings && !json.response.data) {
          throw new Error("EIA warning: " + JSON.stringify(json.response.warnings));
        }
        var rows = ((json.response && json.response.data) || []).filter(function (d) {
          return d.value !== null && d.value !== "" && !isNaN(parseFloat(d.value));
        });
        if (rows.length < 2) throw new Error("No data for " + item.series);
        var latest = parseFloat(rows[0].value);
        var prev = parseFloat(rows[1].value);
        var series = rows.slice(0, item.points).map(function (d) { return parseFloat(d.value); }).reverse();
        var result = { price: latest, change: latest - prev, pct: ((latest - prev) / prev) * 100,
                       date: rows[0].period, series: series };
        setCached(item.series, result);
        return result;
      });
  }

  function sparkline(series, isUp, id) {
    var w = 200, h = 44, pad = 2;
    var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
    var range = (max - min) || 1;
    var pts = series.map(function (v, i) {
      var x = (i / (series.length - 1)) * w;
      var y = pad + (1 - (v - min) / range) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var color = isUp ? "#2e7d32" : "#d32f2f";
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="g' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.25"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<polygon points="0,' + h + ' ' + pts.join(" ") + ' ' + w + ',' + h + '" fill="url(#g' + id + ')"/>' +
      '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + color + '" stroke-width="1.5" ' +
      'vector-effect="non-scaling-stroke"/></svg>';
  }

  function card(item, d, idx) {
    var isUp = d.change >= 0;
    var arrow = isUp ? "&#9650;" : "&#9660;";
    return '<div class="card">' +
      '<div class="name">' + item.label + '</div>' +
      '<div class="price">' + d.price.toFixed(2) + ' <span class="unit">' + item.unit + '</span></div>' +
      '<div class="chg ' + (isUp ? "up" : "down") + '">' + arrow + ' ' + Math.abs(d.pct).toFixed(2) + '%</div>' +
      sparkline(d.series, isUp, idx) +
      '<div class="asof">As of ' + d.date + '</div>' +
      '</div>';
  }

  if (API_KEY.indexOf("YOUR_EIA") === 0) {
    cardsEl.innerHTML = showError("Add your EIA API key at the top of this file.");
  } else Promise.all(COMMODITIES.map(function (item, i) {
    return fetchCommodity(item)
      .then(function (d) { return card(item, d, i); })
      .catch(function (e) {
        console.error(item.label, e);
        var msg = (e && e.message) ? e.message : String(e);
        if (msg === "Failed to fetch") msg = "Request blocked or network error (likely CORS or a bad key)";
        return showError(item.label + ": " + msg);
      });
  })).then(function (results) {
    cardsEl.innerHTML = results.join("");
  });
</script>
</body>
</html>
